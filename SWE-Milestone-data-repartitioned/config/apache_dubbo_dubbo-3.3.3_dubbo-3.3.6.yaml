# Apache Dubbo 3.3.3 -> 3.3.6 配置
# 源代码目录（包含运行时/编译所需的产品逻辑源代码）
repo_src_dirs:
  - dubbo-cluster
  - dubbo-common
  - dubbo-compatible
  - dubbo-compiler
  - dubbo-config
  - dubbo-configcenter
  - dubbo-container
  - dubbo-filter
  - dubbo-maven-plugin
  - dubbo-metadata
  - dubbo-metrics
  - dubbo-monitor
  - dubbo-native
  - dubbo-native-plugin
  - dubbo-plugin
  - dubbo-registry
  - dubbo-remoting
  - dubbo-rpc
  - dubbo-serialization
  - dubbo-spring-boot-project

# 测试目录/文件模式
test_dirs:
  - "**/src/test/**"
  - "**/test/**"
  - "**/*Test.java"
  - "**/*Tests.java"
  - "**/*IT.java"
  - "**/*TestCase.java"
  - "**/*Test.groovy"
  - "**/*Spec.groovy"
  - "dubbo-test/**"
  - "dubbo-demo/**"

# 额外排除模式（repo_src_dirs 内部的非代码文件）
exclude:
  - "**/target/**"

main_branch: "3.3"
