repo_src_dirs:
  - sklearn

# 测试目录/文件模式
test_dirs:
  # Generic test patterns
  - "**/test_*.py"
  - "**/*_test.py"
  - "**/conftest.py"
  - "**/tests/**"

  # Specific test directories from sklearn
  - "sklearn/tests/**"
  - "sklearn/*/tests/**"
  - "sklearn/*/*/tests/**"

# 排除目录 (repo_src_dirs 内部不需要分析的目录)
exclude:
  # 数据文件 (不是源代码)
  - "sklearn/datasets/data/**"
  - "sklearn/datasets/descr/**"
  - "sklearn/datasets/images/**"

main_branch: main
