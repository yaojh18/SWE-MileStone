# Source code directories
repo_src_dirs:
  - src/
  - packages/shared-components/src/
  - res/css/

# 测试目录/文件模式
test_dirs:
  - "test/**"
  - "playwright/**"
  - "__mocks__/**"
  - "**/*.test.*"
  - "**/*.spec.*"
  - "**/__snapshots__/**"
  - "**/__tests__/**"

# 排除目录 (repo_src_dirs 内部不需要分析的目录)
exclude:
  - "**/*.stories.*"  # Storybook 文件
  - "**/.idea/**"     # IDE 配置
  - "**/i18n/strings/**"  # 翻译文件

# element-web 使用 develop 作为主干分支
main_branch: "develop"