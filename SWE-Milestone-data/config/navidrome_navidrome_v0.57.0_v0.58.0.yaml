repo_src_dirs:
  - adapters
  - cmd
  - conf
  - consts
  - core
  - db
  - log
  - model
  - persistence
  - plugins
  # - resources  # 排除：静态资源 (i18n, 占位图)
  - scanner
  - scheduler
  - server
  - ui
  - utils

# 测试目录/文件模式
test_dirs:
  - "tests/**"
  - "**/*_test.go"
  - "**/testdata/**"
  - "**/configtest/**"
  - "ui/src/**/*.test.js"
  - "ui/src/**/*.test.jsx"
  - "ui/src/**/*.test.ts"
  - "ui/src/**/*.test.tsx"
  - "ui/src/**/__snapshots__/**"

# 排除目录 (repo_src_dirs 内部不需要分析的目录)
exclude:
  # 静态资源
  - "ui/public/**"
  - "ui/src/i18n/*.json"

  # 构建产物
  - "ui/build/**"

  # 依赖声明文件
  - "ui/package.json"
  - "ui/package-lock.json"

  # 开发环境/lint/format 配置
  - "ui/.eslint*"
  - "ui/prettier.config.js"

  # 构建脚本 (非构建规则)
  - "ui/bin/**"

  # 自动生成代码
  - "cmd/wire_gen.go"
  - "**/*.pb.go"

# 生成代码文件 (虽被 exclude 但需要包含在 snapshot 中用于编译)
generated_patterns:
  - "**/*.pb.go"
  - "**/wire_gen.go"

main_branch: master

base_image_name: "navidrome_navidrome_v0.57.0_v0.58.0/baseline_001_rerun_stage4/base:latest"
build_command: "cd /testbed/ui && npm ci && npm run build && cd /testbed && go build -tags=netgo ."
