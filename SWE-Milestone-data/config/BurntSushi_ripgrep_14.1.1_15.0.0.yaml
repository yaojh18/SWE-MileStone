repo_src_dirs:
  - crates

# 测试目录/文件模式 (注: Rust 内嵌 #[cfg(test)] 无法用 glob 排除)
test_dirs:
  - "tests/**"
  - "crates/*/tests/**"
  - "crates/*/benches/**"
  - "benchsuite/**"
  - "fuzz/**"

# 排除目录 (repo_src_dirs 内部不需要分析的目录)
exclude:
  - "crates/*/examples/**"
  - "crates/core/flags/complete/*.sh"
  - "crates/core/flags/complete/*.fish"
  - "crates/core/flags/complete/*.zsh"
  - "crates/core/flags/doc/*.help"
  - "crates/core/flags/doc/*.1"

main_branch: master

base_image_name: "burntsushi_ripgrep_14.1.1_15.0.0/base:latest"
build_command: "cd /testbed && cargo build --workspace --features pcre2"
